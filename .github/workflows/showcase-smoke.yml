name: Week 1 Arcade Browser Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gamelab-server.log 2>&1 &
      - run: node tests/showcase-week1.smoke.cjs
      - run: node tests/showcase-week2.smoke.cjs
